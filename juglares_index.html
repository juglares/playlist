<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juglares</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Josefin+Sans:wght@200;300&display=swap');

  :root{
    --bg: #0B0E1A;
    --bg-glow: #1E1710;
    --card: #1E1710;
    --card-2: #2A2014;
    --gold: #D4A24C;
    --accent: #C08A32;
    --accent-dim: #4a3414;
    --cream: #F1EAD9;
    --muted: #8C7E6B;
    --line: #332a1a;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    position:relative;
    background: radial-gradient(circle at 50% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
    min-height:100%;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(241,234,217,0.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 8%, rgba(241,234,217,0.28) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 25%, rgba(192,138,50,0.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 40%, rgba(241,234,217,0.22) 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 60%, rgba(241,234,217,0.28) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 15% 70%, rgba(192,138,50,0.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 85%, rgba(241,234,217,0.22) 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 92%, rgba(241,234,217,0.28) 50%, transparent 51%);
    pointer-events:none;
    z-index:0;
  }

  .app{ width:100%; max-width: 460px; position:relative; z-index:1; }

  header{ text-align:center; margin-bottom: 34px; }
  .brand-row{ display:flex; flex-direction:column; align-items:center; gap:16px; margin-bottom: 6px; }
  .n-ring{
    width:80px; height:80px; border-radius:50%;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .n-ring svg{ width:44px; height:44px; }
  .logo{
    font-family:'Josefin Sans', sans-serif;
    font-weight:200;
    font-size: 25px;
    letter-spacing: 5px;
    color: var(--cream);
  }
  .slogan{ margin-top:14px; font-size:14.5px; color: var(--muted); font-weight:400; }

  .player{
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border:1px solid var(--line);
    border-radius: 22px;
    padding: 28px 26px 22px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.7);
  }

  .cassette{
    background: radial-gradient(circle at 50% 35%, #2b2014 0%, #140f0a 75%);
    border:1px solid var(--line);
    border-radius:14px;
    padding: 20px 18px 16px;
    margin-bottom: 22px;
  }
  .cassette-top{ display:flex; align-items:center; gap:14px; }

  .cover{ width:56px; height:56px; border-radius:10px; flex-shrink:0; object-fit:cover; background: var(--card-2); border:1px solid var(--line); }
  .cover-fallback{
    width:56px; height:56px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, #3a2a1480 0%, #140f0a80 100%); border:1px solid var(--line);
  }
  .cover-fallback svg{ width:24px; height:24px; color: var(--accent); opacity:0.85; }

  .reel{ width:18px; height:18px; flex-shrink:0; color: var(--accent); opacity:0.5; animation: twinkle 2.2s ease-in-out infinite; }
  .cassette.playing .reel{ opacity:1; animation-duration: 1.1s; }
  .reel svg{ width:100%; height:100%; }
  @keyframes twinkle{ 0%,100%{ transform: scale(0.85); opacity:0.4; } 50%{ transform: scale(1.05); opacity:1; } }

  .cassette-label{ flex:1; overflow:hidden; }
  .track-title{ font-size: 15.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-sub{ margin-top:4px; font-size:12px; color: var(--muted); }

  .light-strip{ display:flex; align-items:flex-end; justify-content:center; gap: 4px; height: 20px; margin-top: 16px; }
  .light-bar{
    width: 4px; height: 100%; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent) 0%, var(--gold) 100%);
    transform: scaleY(0.12); transform-origin: bottom; opacity: 0.35;
    transition: transform .12s ease, opacity .12s ease;
  }

  .progress-row{ display:flex; align-items:center; gap:10px; font-size:11.5px; color: var(--muted); margin-bottom: 18px; }
  .progress-bar{ flex:1; height:4px; background: var(--line); border-radius:4px; position:relative; cursor:pointer; }
  .progress-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background: var(--accent); border-radius:4px; }

  .controls{ display:flex; align-items:center; justify-content:center; gap: 22px; margin-bottom: 22px; }
  .ctrl-btn{ background:none; border:none; color: var(--cream); cursor:pointer; opacity:0.85; transition: opacity .15s, transform .15s; }
  .ctrl-btn:hover{ opacity:1; transform: translateY(-1px); }
  .ctrl-btn svg{ width:20px; height:20px; }

  .play-btn{
    width:58px; height:58px; border-radius:50%; background: var(--accent);
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
    color:#2a1c0a; box-shadow: 0 10px 26px -8px rgba(192,138,50,0.55); transition: transform .15s;
  }
  .play-btn:hover{ transform: scale(1.04); }
  .play-btn svg{ width:22px; height:22px; }

  .volume-row{ display:flex; align-items:center; gap:10px; margin-bottom: 4px; }
  .volume-row svg{ width:16px; height:16px; color:var(--muted); flex-shrink:0; }
  input[type="range"]{ -webkit-appearance:none; width:100%; height:3px; background: var(--line); border-radius:4px; outline:none; }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background: var(--accent); cursor:pointer; margin-top:-4.5px;
  }

  .list-header{ display:flex; align-items:baseline; justify-content:space-between; margin: 30px 0 12px; padding: 0 2px; }
  .list-header h2{ font-family:'Fraunces', serif; font-weight:500; font-size:19px; margin:0; }
  .refresh-btn{
    background:none; border:1px solid var(--line); color: var(--muted); font-size:12px; padding:6px 12px;
    border-radius:20px; cursor:pointer; font-family:'Work Sans', sans-serif; transition: border-color .15s, color .15s;
  }
  .refresh-btn:hover{ border-color: var(--accent-dim); color: var(--cream); }

  .track-list{ display:flex; flex-direction:column; gap:3px; }
  .track-item{ display:flex; align-items:center; gap:12px; padding: 9px 12px; border-radius:10px; cursor:pointer; transition: background .15s; }
  .track-item:hover{ background: var(--card-2); }
  .track-item.active{ background: var(--card-2); }

  .row-cover{ width:32px; height:32px; border-radius:7px; flex-shrink:0; object-fit:cover; background: var(--card-2); }
  .row-cover-fallback{
    width:32px; height:32px; border-radius:7px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #3a2a14, #170f08); color: var(--accent);
    font-family:'Fraunces', serif; font-size:13px; font-style:italic;
  }

  .track-num{ width:18px; font-size:12.5px; color: var(--muted); text-align:center; flex-shrink:0; }
  .track-item.active .track-num{ color: var(--accent); }
  .track-name{ flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track-item.active .track-name{ color: var(--accent); font-weight:500; }

  .eq{ display:flex; gap:2px; align-items:flex-end; height:12px; }
  .eq span{ width:2.5px; background: var(--gold); border-radius:1px; animation: eq 0.9s ease-in-out infinite; }
  .eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .eq span:nth-child(2){ height:100%; animation-delay:.15s; }
  .eq span:nth-child(3){ height:65%; animation-delay:.3s; }
  @keyframes eq{ 0%,100%{ transform: scaleY(0.4); } 50%{ transform: scaleY(1); } }

  .state-box{ text-align:center; padding: 40px 20px; color: var(--muted); font-size:14px; line-height:1.6; }
  .state-box strong{ color: var(--cream); display:block; margin-bottom:6px; font-size:15px; }

  footer{ text-align:center; margin-top: 30px; font-size:11.5px; color: #51432c; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand-row">
      <div class="n-ring">
        <svg viewBox="0 0 100 100" fill="none" stroke="#1E1710" stroke-width="5.5" stroke-linecap="round">
          <circle cx="50" cy="50" r="22"/>
          <path d="M50 10v14M50 76v14M10 50h14M76 50h14M23 23l10 10M67 23l-10 10M23 77l10-10M67 77l-10-10"/>
        </svg>
      </div>
      <div class="logo">JUGLARES</div>
    </div>
    <div class="slogan">Del Valle Andino</div>
  </header>

  <div class="player">
    <div class="cassette" id="cassette">
      <div class="cassette-top">
        <img class="cover" id="coverImg" style="display:none;" alt="">
        <div class="cover-fallback" id="coverFallback">
          <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
            <circle cx="50" cy="50" r="18"/>
            <path d="M50 14v10M50 76v10M14 50h10M76 50h10M27 27l8 8M73 27l-8 8M27 73l8-8M73 73l-8-8"/>
          </svg>
        </div>
        <div class="cassette-label">
          <div class="track-title" id="trackTitle">Cargando tu música…</div>
          <div class="track-sub" id="trackSub">—</div>
        </div>
        <div class="reel">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
        </div>
      </div>
      <div class="light-strip" id="lightStrip"></div>
    </div>

    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="durTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="Anterior">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" title="Reproducir">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Siguiente">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>

  <div class="list-header">
    <h2>Tu repertorio</h2>
    <button class="refresh-btn" id="refreshBtn">Actualizar</button>
  </div>

  <div id="listArea">
    <div class="state-box">Buscando canciones en tu Drive…</div>
  </div>

  <footer>Servido directo desde tu carpeta de Google Drive</footer>
</div>

<script>
const CONFIG = {
  API_KEY: "AIzaSyBWnQjnR61KjgQ7FbXxWMjgvES2mjJFsFU",
  FOLDER_ID: "1m_nDmyEhdumu5NGxqgBloRZHF8-KKF7x",
};

const audio = new Audio();
let tracks = [];
let currentIndex = -1;
let isPlaying = false;

const els = {
  cassette: document.getElementById('cassette'),
  coverImg: document.getElementById('coverImg'),
  coverFallback: document.getElementById('coverFallback'),
  trackTitle: document.getElementById('trackTitle'),
  trackSub: document.getElementById('trackSub'),
  playBtn: document.getElementById('playBtn'),
  playIcon: document.getElementById('playIcon'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  progressBar: document.getElementById('progressBar'),
  progressFill: document.getElementById('progressFill'),
  curTime: document.getElementById('curTime'),
  durTime: document.getElementById('durTime'),
  listArea: document.getElementById('listArea'),
  refreshBtn: document.getElementById('refreshBtn'),
  volume: document.getElementById('volume'),
  lightStrip: document.getElementById('lightStrip'),
};

audio.volume = 0.8;

const LIGHT_BAR_COUNT = 14;
const lightBars = [];
for(let i=0;i<LIGHT_BAR_COUNT;i++){
  const b = document.createElement('div');
  b.className = 'light-bar';
  els.lightStrip.appendChild(b);
  lightBars.push(b);
}

function animateLights(){
  const t = performance.now() / 1000;
  lightBars.forEach((bar, i) => {
    if(isPlaying){
      const v = (Math.sin(t*3.2 + i*0.65) + 1) / 2 * 0.8 + Math.random()*0.15;
      bar.style.transform = `scaleY(${0.15 + v*0.85})`;
      bar.style.opacity = 0.45 + v*0.55;
    } else {
      bar.style.transform = 'scaleY(0.12)';
      bar.style.opacity = 0.3;
    }
  });
  requestAnimationFrame(animateLights);
}
animateLights();

function cleanName(name){ return name.replace(/\.[^/.]+$/, "").replace(/[_-]+/g, " ").trim(); }
function baseKey(name){ return name.replace(/\.[^/.]+$/, "").trim().toLowerCase(); }
function fmtTime(sec){
  if(!isFinite(sec)) return "0:00";
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

async function loadTracks(){
  els.listArea.innerHTML = `<div class="state-box">Buscando canciones en tu Drive…</div>`;
  try{
    const q = encodeURIComponent(`'${CONFIG.FOLDER_ID}' in parents and trashed = false`);
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType)&orderBy=name&pageSize=200&key=${CONFIG.API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error){ throw new Error(data.error.message || "Error de la API"); }

    const allFiles = data.files || [];
    const imageMap = {};
    allFiles.forEach(f => {
      if(f.mimeType && f.mimeType.startsWith('image/')){ imageMap[baseKey(f.name)] = f.id; }
    });

    tracks = allFiles
      .filter(f => f.mimeType && f.mimeType.startsWith('audio/'))
      .map(f => {
        const key = baseKey(f.name);
        const coverId = imageMap[key] || null;
        return {
          id: f.id,
          name: cleanName(f.name),
          src: `https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&key=${CONFIG.API_KEY}`,
          cover: coverId ? `https://www.googleapis.com/drive/v3/files/${coverId}?alt=media&key=${CONFIG.API_KEY}` : null
        };
      });

    if(tracks.length === 0){
      els.listArea.innerHTML = `<div class="state-box"><strong>Tu carpeta está vacía (por ahora)</strong>Sube un archivo de audio a la carpeta de Drive y dale a "Actualizar".</div>`;
      els.trackTitle.textContent = "Sin canciones aún";
      els.trackSub.textContent = "—";
      return;
    }

    renderList();
    if(currentIndex === -1){ loadTrack(0, false); }
  }catch(err){
    els.listArea.innerHTML = `<div class="state-box"><strong>No pude leer tu carpeta</strong>Revisa que la clave de API y el ID de carpeta sean correctos, y que la carpeta esté compartida como "Cualquiera con el enlace".<br><br><span style="color:#c77">${err.message}</span></div>`;
  }
}

function renderList(){
  els.listArea.innerHTML = "";
  const list = document.createElement('div');
  list.className = 'track-list';
  tracks.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'track-item' + (i === currentIndex ? ' active' : '');
    const coverHtml = t.cover
      ? `<img class="row-cover" src="${t.cover}" alt="">`
      : `<div class="row-cover-fallback">${t.name.charAt(0).toUpperCase()}</div>`;
    item.innerHTML = `
      <span class="track-num">${i === currentIndex && isPlaying ? '' : (i+1).toString().padStart(2,'0')}</span>
      ${coverHtml}
      <span class="track-name">${t.name}</span>
    `;
    if(i === currentIndex && isPlaying){
      item.querySelector('.track-num').innerHTML = `<span class="eq"><span></span><span></span><span></span></span>`;
    }
    item.addEventListener('click', () => loadTrack(i, true));
    list.appendChild(item);
  });
  els.listArea.appendChild(list);
}

function updateCover(t){
  if(t.cover){
    els.coverImg.src = t.cover;
    els.coverImg.style.display = 'block';
    els.coverFallback.style.display = 'none';
  } else {
    els.coverImg.style.display = 'none';
    els.coverFallback.style.display = 'flex';
  }
}

function loadTrack(index, autoplay){
  currentIndex = index;
  const t = tracks[index];
  audio.src = t.src;
  els.trackTitle.textContent = t.name;
  els.trackSub.textContent = `Pista ${index+1} de ${tracks.length}`;
  updateCover(t);
  renderList();
  if(autoplay){ play(); } else { pause(); }
}

function play(){
  audio.play().catch(()=>{});
  isPlaying = true;
  els.cassette.classList.add('playing');
  els.playIcon.innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  renderList();
}
function pause(){
  audio.pause();
  isPlaying = false;
  els.cassette.classList.remove('playing');
  els.playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  renderList();
}
function togglePlay(){
  if(currentIndex === -1 && tracks.length){ loadTrack(0, true); return; }
  isPlaying ? pause() : play();
}
function nextTrack(){ if(!tracks.length) return; loadTrack((currentIndex + 1) % tracks.length, true); }
function prevTrack(){ if(!tracks.length) return; loadTrack((currentIndex - 1 + tracks.length) % tracks.length, true); }

audio.addEventListener('timeupdate', () => {
  if(!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  els.progressFill.style.width = pct + '%';
  els.curTime.textContent = fmtTime(audio.currentTime);
  els.durTime.textContent = fmtTime(audio.duration);
});
audio.addEventListener('ended', nextTrack);

els.progressBar.addEventListener('click', (e) => {
  const rect = els.progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if(audio.duration){ audio.currentTime = pct * audio.duration; }
});

els.volume.addEventListener('input', (e) => { audio.volume = e.target.value; });
els.playBtn.addEventListener('click', togglePlay);
els.nextBtn.addEventListener('click', nextTrack);
els.prevBtn.addEventListener('click', prevTrack);
els.refreshBtn.addEventListener('click', loadTracks);

loadTracks();
</script>
</body>
</html>
